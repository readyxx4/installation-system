<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ลืมรหัสผ่าน - ห้างโอวเปงฮง จำกัด</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* =====================================================
       Forgot Password Page - matches Login blue theme
       ===================================================== */
    body.login-page-final {
      --login-primary: #2196F3;
      --login-primary-dark: #0D47A1;
      --login-ink: #0f172a;
      --login-muted: #64748b;
      margin: 0;
      min-height: 100vh;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 16% 18%, rgba(34, 211, 238, .22), transparent 28%),
        radial-gradient(circle at 82% 16%, rgba(33, 150, 243, .28), transparent 30%),
        radial-gradient(circle at 72% 86%, rgba(14, 165, 233, .18), transparent 32%),
        linear-gradient(135deg, #06162f 0%, #0D47A1 52%, #0891b2 100%);
      color: var(--login-ink);
      font-family: "Noto Sans Thai", "Sarabun", "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body.login-page-final::before,
    body.login-page-final::after {
      content: "";
      position: absolute;
      inset: auto;
      pointer-events: none;
    }

    body.login-page-final::before {
      width: 520px;
      height: 520px;
      left: -160px;
      top: -170px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
    }

    body.login-page-final::after {
      width: 420px;
      height: 420px;
      right: -130px;
      bottom: -150px;
      border-radius: 120px;
      background: rgba(227, 242, 253, .12);
      transform: rotate(18deg);
    }

    .login-shell-final {
      position: relative;
      z-index: 1;
      width: min(380px, calc(100% - 40px));
      max-height: calc(100vh - 40px);
      overflow: auto;
    }

    .login-form-area-final {
      padding: 27px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .88), rgba(255, 255, 255, .78)),
        rgba(227, 242, 253, .38);
      border: 1px solid rgba(219, 234, 254, .82);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(2, 8, 23, .28);
      backdrop-filter: blur(20px);
    }

    .login-form-card-final {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .login-brand-final {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      margin-bottom: 19px;
    }

    .login-logo-final {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: #ffffff;
      color: var(--login-primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 0 14px 28px rgba(3, 105, 161, .22);
      overflow: hidden;
      padding: 4px;
      border: 1px solid rgba(144, 202, 249, .72);
    }

    .login-logo-final img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }

    .login-brand-final strong {
      display: block;
      font-size: 15px;
      line-height: 1.25;
      color: var(--login-ink);
    }

    .login-brand-final span {
      display: block;
      margin-top: 3px;
      font-size: 10.5px;
      color: var(--login-muted);
    }

    .login-form-card-final h2 {
      margin: 0 0 6px;
      font-size: 23px;
      color: var(--login-ink);
      line-height: 1.25;
      text-align: center;
    }

    .login-subtitle-final {
      margin: 0 0 19px;
      color: var(--login-muted);
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.65;
      text-align: center;
    }

    .login-alert-final {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 11px;
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      font-size: 12px;
      font-weight: 800;
    }

    .login-alert-final.info {
      background: #eaf2ff;
      color: var(--login-primary-dark);
      border-color: #bfdbfe;
    }

    .login-alert-final.show {
      display: block;
    }

    .login-field-final {
      margin-bottom: 13px;
    }

    .login-field-final label {
      display: block;
      margin-bottom: 7px;
      color: var(--login-ink);
      font-weight: 900;
      font-size: 12px;
    }

    .login-input-wrap-final {
      position: relative;
    }

    .login-icon-final {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 13px;
      pointer-events: none;
      z-index: 1;
    }

    .login-input-wrap-final input {
      width: 100%;
      height: 39px;
      border-radius: 11px;
      border: 1.5px solid #dbeafe;
      background: #f8fbff;
      color: var(--login-ink);
      padding: 0 36px;
      font-size: 12.5px;
      outline: none;
      box-sizing: border-box;
      transition: .18s ease;
    }

    .login-input-wrap-final input:focus {
      border-color: var(--login-primary);
      box-shadow: 0 0 0 4px rgba(33, 150, 243, .14);
      background: #ffffff;
    }

    .login-input-wrap-final input::placeholder {
      color: #94a3b8;
    }

    .login-submit-final {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 12px;
      margin-top: 6px;
      background: linear-gradient(135deg, var(--login-primary) 0%, var(--login-primary-dark) 100%);
      color: #ffffff;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(13, 71, 161, .22);
      transition: .18s ease;
    }

    .login-submit-final:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 36px rgba(13, 71, 161, .28);
    }

    .forgot-back-link-final {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 13px;
      color: var(--login-primary-dark);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.6;
      text-decoration: none;
    }

    .forgot-back-link-final:hover {
      color: var(--login-primary);
      text-decoration: underline;
    }

    @media (max-width: 980px) {
      body.login-page-final {
        overflow: auto;
        padding: 20px;
      }

      .login-shell-final {
        width: min(380px, 100%);
        max-height: none;
      }

      .login-form-area-final {
        padding: 24px 19px;
      }
    }

    @media (max-width: 480px) {
      body.login-page-final {
        padding: 16px;
      }

      .login-shell-final {
        width: 100%;
      }

      .login-form-area-final {
        padding: 22px 16px;
        border-radius: 18px;
      }

      .login-logo-final {
        width: 56px;
        height: 56px;
        border-radius: 16px;
      }

      .login-form-card-final h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body class="login-page-final">
  <main class="login-shell-final">
    <section class="login-form-area-final">
      <div class="login-form-card-final">
        <div class="login-brand-final">
          <div class="login-logo-final">
            <img src="uploads/system/owpenghong_logo.jpg" alt="โลโก้ห้างโอวเปงฮง">
          </div>
          <div>
            <strong>ห้างโอวเปงฮง จำกัด</strong>
            <span>Installation System</span>
          </div>
        </div>

        <h2>ลืมรหัสผ่าน</h2>
        <p class="login-subtitle-final">กรอกอีเมลที่ใช้สมัครสมาชิกเพื่อดำเนินการตั้งรหัสผ่านใหม่</p>

        <div class="login-alert-final" id="forgotAlert">
          <span id="forgotAlertText">กรุณากรอกอีเมล</span>
        </div>

        <form id="forgotPasswordForm" novalidate>
          <div class="login-field-final">
            <label for="forgot_email">อีเมล</label>
            <div class="login-input-wrap-final">
              <span class="login-icon-final">✉</span>
              <input
                type="email"
                id="forgot_email"
                name="email"
                placeholder="กรอกอีเมล เช่น example@gmail.com"
                maxlength="50"
                autocomplete="email"
                required
                autofocus
              />
            </div>
          </div>

          <button type="submit" class="login-submit-final">ดำเนินการต่อ</button>
        </form>

        <a class="forgot-back-link-final" href="login.html">← กลับเข้าสู่ระบบ</a>
      </div>
    </section>
  </main>

  <script>
    const forgotForm = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('forgot_email');
    const alertBox = document.getElementById('forgotAlert');
    const alertText = document.getElementById('forgotAlertText');

    function showMessage(message, type) {
      if (!alertBox || !alertText) return;

      alertText.textContent = message;
      alertBox.className = 'login-alert-final show';

      if (type === 'info') {
        alertBox.classList.add('info');
      }
    }

    if (forgotForm && emailInput) {
      forgotForm.addEventListener('submit', function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();

        if (email === '') {
          showMessage('กรุณากรอกอีเมล');
          emailInput.focus();
          return;
        }

        if (!emailInput.checkValidity()) {
          showMessage('รูปแบบอีเมลไม่ถูกต้อง');
          emailInput.focus();
          return;
        }

        showMessage('ระบบลืมรหัสผ่านยังไม่เปิดใช้งาน กรุณารอขั้นตอนถัดไป', 'info');
      });
    }
  </script>
</body>

</html>
