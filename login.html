<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ - ห้างโอวเปงฮง จำกัด</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* =====================================================
       Login Page - Scoped fullscreen blue theme
       ===================================================== */
    body.login-page-final {
      --login-primary: #2196F3;
      --login-primary-dark: #0D47A1;
      --login-ink: #0f172a;
      --login-muted: #64748b;
      margin: 0;
      min-height: 100vh;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 16% 18%, rgba(34, 211, 238, .22), transparent 28%),
        radial-gradient(circle at 82% 16%, rgba(33, 150, 243, .28), transparent 30%),
        radial-gradient(circle at 72% 86%, rgba(14, 165, 233, .18), transparent 32%),
        linear-gradient(135deg, #06162f 0%, #0D47A1 52%, #0891b2 100%);
      color: var(--login-ink);
      font-family: "Noto Sans Thai", "Sarabun", "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body.login-page-final::before,
    body.login-page-final::after {
      content: "";
      position: absolute;
      inset: auto;
      pointer-events: none;
    }

    body.login-page-final::before {
      width: 520px;
      height: 520px;
      left: -160px;
      top: -170px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
    }

    body.login-page-final::after {
      width: 420px;
      height: 420px;
      right: -130px;
      bottom: -150px;
      border-radius: 120px;
      background: rgba(227, 242, 253, .12);
      transform: rotate(18deg);
    }

    .login-shell-final {
      position: relative;
      z-index: 1;
      width: min(380px, calc(100% - 40px));
      max-height: calc(100vh - 40px);
      overflow: auto;
    }

    .login-brand-final {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      margin-bottom: 19px;
    }

    .login-logo-final {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: #ffffff;
      color: var(--login-primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 0 14px 28px rgba(3, 105, 161, .22);
      overflow: hidden;
      padding: 4px;
      border: 1px solid rgba(144, 202, 249, .72);
    }

    .login-logo-final img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }

    .login-brand-final strong {
      display: block;
      font-size: 15px;
      line-height: 1.25;
      color: var(--login-ink);
    }

    .login-brand-final span {
      display: block;
      margin-top: 3px;
      font-size: 10.5px;
      color: var(--login-muted);
    }

    .login-form-area-final {
      padding: 27px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .88), rgba(255, 255, 255, .78)),
        rgba(227, 242, 253, .38);
      border: 1px solid rgba(219, 234, 254, .82);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(2, 8, 23, .28);
      backdrop-filter: blur(20px);
    }

    .login-form-card-final {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .login-form-card-final h2 {
      margin: 0 0 6px;
      font-size: 23px;
      color: var(--login-ink);
      line-height: 1.25;
      text-align: center;
    }

    .login-subtitle-final {
      margin: 0 0 19px;
      color: var(--login-muted);
      font-size: 12.5px;
      font-weight: 700;
      text-align: center;
    }

    .login-alert-final {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 11px;
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      font-size: 12px;
      font-weight: 800;
    }

    .login-alert-final.success {
      background: #dcfce7;
      color: #166534;
      border-color: #bbf7d0;
    }

    .login-alert-final.show {
      display: block;
    }

    .login-field-final {
      margin-bottom: 13px;
    }

    .login-field-final label {
      display: block;
      margin-bottom: 7px;
      color: var(--login-ink);
      font-weight: 900;
      font-size: 12px;
    }

    .login-input-wrap-final {
      position: relative;
    }

    .login-icon-final {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 13px;
      pointer-events: none;
      z-index: 1;
    }

    .login-input-wrap-final input,
    .login-input-wrap-final select {
      width: 100%;
      height: 39px;
      border-radius: 11px;
      border: 1.5px solid #dbeafe;
      background: #f8fbff;
      color: var(--login-ink);
      padding: 0 36px;
      font-size: 12.5px;
      outline: none;
      box-sizing: border-box;
      transition: .18s ease;
    }

    .login-input-wrap-final input:focus,
    .login-input-wrap-final select:focus {
      border-color: var(--login-primary);
      box-shadow: 0 0 0 4px rgba(33, 150, 243, .14);
      background: #ffffff;
    }

    .login-input-wrap-final input::placeholder {
      color: #94a3b8;
    }

    .login-toggle-pass-final {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      font-size: 13px;
    }

    .login-submit-final {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 12px;
      margin-top: 6px;
      background: linear-gradient(135deg, var(--login-primary) 0%, var(--login-primary-dark) 100%);
      color: #ffffff;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(13, 71, 161, .22);
      transition: .18s ease;
    }

    .login-submit-final:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 36px rgba(13, 71, 161, .28);
    }

    .login-links-final {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 13px;
      color: var(--login-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .login-register-link-final {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .login-links-final a {
      color: var(--login-primary-dark);
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .login-links-final a:hover {
      color: var(--login-primary);
      text-decoration: underline;
    }

    .forgot-password-link-final[aria-disabled="true"] {
      cursor: default;
    }

    @media (max-width: 980px) {
      body.login-page-final {
        overflow: auto;
        padding: 20px;
      }

      .login-shell-final {
        width: min(380px, 100%);
        max-height: none;
      }

      .login-form-area-final {
        padding: 24px 19px;
      }
    }

    @media (max-width: 480px) {
      body.login-page-final {
        padding: 16px;
      }

      .login-shell-final {
        width: 100%;
      }

      .login-form-area-final {
        padding: 22px 16px;
        border-radius: 18px;
      }

      .login-logo-final {
        width: 56px;
        height: 56px;
        border-radius: 16px;
      }

      .login-form-card-final h2 {
        font-size: 22px;
      }

      .login-links-final {
        align-items: stretch;
        flex-direction: column;
        gap: 8px;
      }

      .forgot-password-link-final {
        align-self: flex-start;
      }
    }
  </style>
</head>

<body class="login-page-final">
  <main class="login-shell-final">
    <section class="login-form-area-final">
      <div class="login-form-card-final">
        <div class="login-brand-final">
          <div class="login-logo-final">
            <img src="uploads/system/owpenghong_logo.jpg" alt="โลโก้ห้างโอวเปงฮง">
          </div>
          <div>
            <strong>ห้างโอวเปงฮง จำกัด</strong>
            <span>Installation System</span>
          </div>
        </div>

        <h2>เข้าสู่ระบบ</h2>
        <p class="login-subtitle-final">กรุณากรอกข้อมูลเพื่อเข้าสู่ระบบ</p>

        <div class="login-alert-final" id="loginAlert">
          <span id="loginAlertText">เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบข้อมูลอีกครั้ง</span>
        </div>

        <form action="login.php" method="POST" id="loginForm">
          <div class="login-field-final">
            <label for="user_id">อีเมล</label>
            <div class="login-input-wrap-final">
              <span class="login-icon-final">✉</span>
              <input
                type="email"
                id="user_id"
                name="user_id"
                placeholder="กรอกอีเมล เช่น example@gmail.com"
                maxlength="50"
                autocomplete="email"
                required
                autofocus
              />
            </div>
          </div>

          <div class="login-field-final">
            <label for="user_password">รหัสผ่าน</label>
            <div class="login-input-wrap-final">
              <span class="login-icon-final">⌘</span>
              <input
                type="password"
                id="user_password"
                name="user_password"
                placeholder="กรอกรหัสผ่าน"
                maxlength="50"
                autocomplete="current-password"
                required
              />
              <button type="button" class="login-toggle-pass-final" id="togglePass" aria-label="แสดง/ซ่อนรหัสผ่าน">👁</button>
            </div>
          </div>

          <div class="login-field-final">
            <label for="login_type">เลือกประเภทผู้ใช้งาน</label>
            <div class="login-input-wrap-final">
              <span class="login-icon-final">☷</span>
              <select id="login_type" name="login_type" required>
                <option value="" selected disabled>กรุณาเลือกประเภทผู้ใช้งาน</option>
                <option value="0">ลูกค้า</option>
                <option value="1">หัวหน้าช่าง</option>
                <option value="2">พนักงานขาย</option>
                <option value="3">ผู้ดูแลระบบ</option>
                <option value="technician">ช่างติดตั้ง</option>
              </select>
            </div>
          </div>

          <button type="submit" class="login-submit-final">เข้าสู่ระบบ</button>
        </form>

        <div class="login-links-final">
          <div class="login-register-link-final">
            <a href="register.html">สมัครสมาชิก</a>
          </div>

          <a class="forgot-password-link-final" href="forgot_password.html">
            ลืมรหัสผ่าน
          </a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const togglePass = document.getElementById('togglePass');
    const passwordInput = document.getElementById('user_password');

    if (togglePass && passwordInput) {
      togglePass.addEventListener('click', function () {
        passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
      });
    }

    const params = new URLSearchParams(window.location.search);
    const success = params.get('success');
    const error = params.get('error');
    const alertBox = document.getElementById('loginAlert');
    const alertText = document.getElementById('loginAlertText');

    const errorMessages = {
      login: 'กรุณาเข้าสู่ระบบก่อน',
      denied: 'คุณไม่มีสิทธิ์เข้าถึงหน้านี้',
      server: 'เกิดข้อผิดพลาดของระบบ',
      suspended: 'บัญชีของคุณถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ',
      invalid: 'อีเมล รหัสผ่าน หรือสิทธิ์การใช้งานไม่ถูกต้อง'
    };

    if (success === 'register' && alertBox && alertText) {
      alertText.textContent = 'สมัครสมาชิกสำเร็จ กรุณาเข้าสู่ระบบ';
      alertBox.classList.add('show', 'success');
    }

    if (error && errorMessages[error] && alertBox && alertText) {
      alertText.textContent = errorMessages[error];
      alertBox.classList.add('show');
    }
  </script>
</body>

</html>
